<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CIA | Portal Interno</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f5f7fa;
        }

        .top-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            min-height: 60px;
            background: #fff8e1;
            border-bottom: 1px solid #ffe082;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 10px 20px;
            z-index: 9999;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .banner-text {
            color: #5f4b00;
            font-size: 14px;
            line-height: 1.4;
        }

        .button-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .btn {
            min-height: 40px;
            border: none;
            border-radius: 6px;
            padding: 10px 16px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
            transition:
                background-color 0.2s ease,
                transform 0.1s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-download {
            background: #0d6efd;
            color: #ffffff;
        }

        .btn-download:hover {
            background: #0b5ed7;
        }

        .btn-copy {
            background: #6c757d;
            color: #ffffff;
        }

        .btn-copy:hover {
            background: #5c636a;
        }

        .btn-full {
            background: #198754;
            color: #ffffff;
        }

        .btn-full:hover {
            background: #157347;
        }

        .container {
            padding-top: 60px;
            width: 100%;
            height: 100vh;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }

        .notification {
            position: fixed;
            right: 20px;
            bottom: 20px;
            max-width: 380px;
            padding: 14px 18px;
            border-radius: 8px;
            background: #212529;
            color: #ffffff;
            font-size: 14px;
            line-height: 1.4;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22);
            opacity: 0;
            visibility: hidden;
            transform: translateY(15px);
            transition:
                opacity 0.25s ease,
                visibility 0.25s ease,
                transform 0.25s ease;
            z-index: 10000;
        }

        .notification.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        @media (max-width: 900px) {
            .top-banner {
                position: relative;
                flex-direction: column;
                align-items: stretch;
                min-height: auto;
            }

            .button-group {
                flex-wrap: wrap;
            }

            .btn {
                flex: 1;
            }

            .container {
                padding-top: 0;
                height: calc(100vh - 160px);
            }
        }
    </style>
</head>

<body>

    <div id="topBanner" class="top-banner">

        <div class="banner-text">
            ⚠️ Caso a página abaixo não seja exibida, faça o download, descompacte e instale o certificado corporativo antes de prosseguir.
        </div>

        <div class="button-group">
            <a
                href="https://raw.githubusercontent.com/gbs-cia/autoescriturador/refs/heads/main/certificado.zip"
                target="_blank"
                rel="noopener noreferrer"
                class="btn btn-download"
                title="Baixar certificado corporativo"
            >
                🔐 Baixar Certificado
            </a>


            <button
                type="button"
                class="btn btn-full"
                onclick="abrirTelaCheia()"
                title="Abrir o portal em uma nova janela"
            >
                🚀 Abrir em Tela Cheia
            </button>

        </div>

    </div>

    <div class="container">

        <iframe
            id="portalFrame"
            src="https://10.177.192.75/"
            title="Portal interno CIA"
            allowfullscreen
        ></iframe>

    </div>

    <div
        id="notification"
        class="notification"
        role="status"
        aria-live="polite"
    ></div>

    <script>
        const URL_CERTIFICADO =
            "https://raw.githubusercontent.com/gbs-cia/autoescriturador/refs/heads/main/certificado.zip";

        const URL_PORTAL =
            "https://10.177.192.75/";

        function abrirTelaCheia() {
            const banner = document.getElementById("topBanner");
            const container = document.querySelector(".container");
        
            banner.style.display = "none";
            container.style.paddingTop = "0";
            container.style.height = "100vh";
        }



        function copiarLinkModoAlternativo() {
            const campoTemporario = document.createElement("textarea");

            campoTemporario.value = URL_CERTIFICADO;
            campoTemporario.setAttribute("readonly", "");
            campoTemporario.style.position = "fixed";
            campoTemporario.style.opacity = "0";

            document.body.appendChild(campoTemporario);

            campoTemporario.select();
            campoTemporario.setSelectionRange(
                0,
                campoTemporario.value.length
            );

            const copiado = document.execCommand("copy");

            document.body.removeChild(campoTemporario);

            if (copiado) {
                mostrarNotificacao(
                    "Link copiado. Cole o endereço em uma nova guia do Edge."
                );
            } else {
                window.prompt(
                    "Copie o endereço do certificado:",
                    URL_CERTIFICADO
                );
            }
        }

        function mostrarNotificacao(mensagem) {
            const notification =
                document.getElementById("notification");

            notification.textContent = mensagem;
            notification.classList.add("show");

            window.clearTimeout(
                mostrarNotificacao.timeout
            );

            mostrarNotificacao.timeout = window.setTimeout(
                function () {
                    notification.classList.remove("show");
                },
                5000
            );
        }
    </script>

</body>
</html>
